services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pazarentegra
      POSTGRES_PASSWORD: pazarentegra
      POSTGRES_DB: pazarentegra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pazarentegra"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
